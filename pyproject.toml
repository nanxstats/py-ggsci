[project]
name = "ggsci"
version = "2.2.1"
description = "Plotnine color palettes inspired by plots in scientific journals, data visualization libraries, science fiction movies, and TV shows"
authors = [{ name = "Nan Xiao", email = "me@nanx.me" }]
dependencies = ["matplotlib>=3.8.0", "numpy>=1.23.5", "plotnine>=0.14.0"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

classifiers = [
    "Intended Audience :: Science/Research",

    "Topic :: Scientific/Engineering :: Visualization",

    "Operating System :: OS Independent",

    "Framework :: Matplotlib",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",

    "Typing :: Typed",
]

requires-python = ">= 3.10"

[project.urls]
Homepage = "https://nanx.me/py-ggsci/"
Documentation = "https://nanx.me/py-ggsci/"
Repository = "https://github.com/nanxstats/py-ggsci"
Issues = "https://github.com/nanxstats/py-ggsci/issues"
Changelog = "https://github.com/nanxstats/py-ggsci/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-exclude = [
    "/docs",
    "/scripts",
    "/AGENTS.md",
    "/uv.lock",
    "/zensical.toml",
]
wheel-exclude = [
    "/docs",
    "/scripts",
    "/AGENTS.md",
    "/uv.lock",
    "/zensical.toml",
]

[dependency-groups]
dev = [
    "isort>=6.0.1",
    "markdown-exec[ansi]>=1.11.0",
    "mkdocstrings-python>=1.18.2",
    "mypy>=1.17.1",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.13.0",
    "zensical>=0.0.15",
]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
